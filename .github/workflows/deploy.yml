name: Production Deploy (VPS)

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-to-vps:
    name: Validar SemVer e Promover Produção (VPS)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: write
      id-token: write
    steps:
      - name: Checkout com Histórico Completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar Tag SemVer e Promoção Aprovada por PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/validate-deploy-governance.sh
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Conferir CI do merge publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f head_sha="$RELEASE_SHA" -f status=success \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .head_sha' |
            grep -Fx "$RELEASE_SHA" || { echo "::error::Aguarde o CI aprovado na main para o SHA da tag."; exit 1; }

      - name: Validar credenciais do Finance
        env:
          AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          [[ -n "$SSH_KEY" && ( -n "$AUTH_KEY" || ( -n "$CLIENT_ID" && -n "$CLIENT_SECRET" ) ) ]]

      - name: Conectar à Tailscale
        timeout-minutes: 2
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          oauth-client-id: ${{ !secrets.TAILSCALE_AUTHKEY && secrets.TS_OAUTH_CLIENT_ID || '' }}
          oauth-secret: ${{ !secrets.TAILSCALE_AUTHKEY && secrets.TS_OAUTH_SECRET || '' }}
          tags: tag:ci-deploy

      - name: Autenticar SSH antes do build
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/finance_key
          trap 'rm -f ~/.ssh/finance_key' EXIT
          echo "finance-prod ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOttXCeXd5LtLDJ6XRhW948AIus1NvbuUJyeYAD7KMW4" > ~/.ssh/finance_hosts
          ssh -MNf -S "$RUNNER_TEMP/finance.sock" -o HostKeyAlias=finance-prod -o UserKnownHostsFile=~/.ssh/finance_hosts \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/finance_key -p "${VPS_SSH_PORT:-22}" "${VPS_SSH_USER:-jeann}@${VPS_HOST:-100.90.8.15}"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e Publicar Imagem para Arquitetura VPS (linux/amd64)
        id: build_image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          build-args: FINANCE_RELEASE_SHA=${{ env.RELEASE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bigdevz-finance-api:${{ github.ref_name }}
          provenance: false

      - name: Determinar Referência Imutável por Digest do Registro
        id: image_digest
        shell: bash
        run: |
          RAW_DIGEST="${{ steps.build_image.outputs.digest }}"
          if [ -z "$RAW_DIGEST" ]; then
            echo "::error::Falha ao obter digest imutável da imagem construída."
            exit 1
          fi
          REGISTRY_REF="ghcr.io/${{ github.repository_owner }}/bigdevz-finance-api@${RAW_DIGEST}"
          echo "registry_ref=${REGISTRY_REF}" >> "$GITHUB_OUTPUT"
          echo "raw_digest=${RAW_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "✅ Imagem publicada no registro com digest imutável: ${REGISTRY_REF}"

      - name: Instalar Trivy no Runner
        shell: bash
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Analisar Artefato Final pelo Digest do Registro com Trivy
        shell: bash
        env:
          TARGET_IMAGE: ${{ steps.image_digest.outputs.registry_ref }}
        run: |
          echo "Executando varredura no artefato imutável exato: $TARGET_IMAGE..."
          trivy image --format json -o trivy-finance-release.json "$TARGET_IMAGE"

      - name: Avaliar Politica de Seguranca do Artefato Homologado
        shell: bash
        run: |
          python3 scripts/eval-promotion-policy.py \
            --scan trivy-finance-release.json \
            --baseline security/baseline.json \
            --mode audit \
            --output-summary $GITHUB_STEP_SUMMARY

      - name: Implantar digest aprovado na VPS
        env:
          TAG_NAME: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image_digest.outputs.registry_ref }}
        run: |
          ssh -S "$RUNNER_TEMP/finance.sock" -o ProxyCommand=false finance-prod -- "$TAG_NAME" "$IMAGE_DIGEST"

      - name: Confirmar revisão pública
        run: |
          curl --fail --silent --show-error --max-time 15 --retry 4 --retry-delay 2 --retry-max-time 30 \
            https://finance.bigdevz.com/api/health |
            jq -e --arg sha "$RELEASE_SHA" '.status == "ok" and .revision == $sha'
