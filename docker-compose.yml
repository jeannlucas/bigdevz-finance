name: finance-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: finance-postgres-dev
    restart: "no"
    environment:
      POSTGRES_USER: bigdevz
      POSTGRES_PASSWORD: ${BIGDEVZ_DB_PASSWORD:-bigdevz_local_password}
      POSTGRES_DB: bigdevz_finance
    ports:
      - "127.0.0.1:${BIGDEVZ_DB_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigdevz -d bigdevz_finance && psql -U bigdevz -d bigdevz_finance_test -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: bigdevz/finance-api:dev
    container_name: finance-api-dev
    build: ./apps/api
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-environment
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BIGDEVZ_API_PORT:-8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: bigdevz_finance
      DB_USERNAME: bigdevz
      DB_PASSWORD: ${BIGDEVZ_DB_PASSWORD:-bigdevz_local_password}
      LOG_CHANNEL: stderr
    ports:
      - "${BIGDEVZ_API_BIND:-127.0.0.1}:${BIGDEVZ_API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  scheduler:
    image: bigdevz/finance-api:dev
    container_name: finance-scheduler-dev
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment: *api-environment
    volumes:
      - ./apps/api:/app
    command: ["php", "artisan", "schedule:work"]

volumes:
  postgres-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${BIGDEVZ_SUBNET:-10.88.231.0/24}
