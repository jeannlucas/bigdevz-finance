name: bigdevz-finance

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bigdevz
      POSTGRES_PASSWORD: ${BIGDEVZ_DB_PASSWORD:-bigdevz_local_dev}
      POSTGRES_DB: bigdevz_finance
    ports:
      - "127.0.0.1:${BIGDEVZ_DB_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigdevz -d bigdevz_finance && psql -U bigdevz -d bigdevz_finance_test -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: bigdevz/finance-api:dev
    build: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-environment
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BIGDEVZ_API_PORT:-8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: bigdevz_finance
      DB_USERNAME: bigdevz
      DB_PASSWORD: ${BIGDEVZ_DB_PASSWORD:-bigdevz_local_dev}
      LOG_CHANNEL: stderr
    ports:
      - "${BIGDEVZ_API_BIND:-127.0.0.1}:${BIGDEVZ_API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # A pagar: gera ocorrências recorrentes e faturas até o horizonte (mês atual
  # + 12) a cada hora, com `payables:generate`. Execuções:
  #   docker compose logs scheduler
  # Contagens por execução: apps/api/storage/logs/payables-generate.log
  scheduler:
    image: bigdevz/finance-api:dev
    depends_on:
      api:
        condition: service_healthy
    environment: *api-environment
    volumes:
      - ./apps/api:/app
    command: ["php", "artisan", "schedule:work"]

volumes:
  postgres-data:

# Sub-rede explícita: os pools padrão do Docker desta máquina estão ocupados
# por outros projetos. Ajuste BIGDEVZ_SUBNET se colidir com a sua rede.
networks:
  default:
    ipam:
      config:
        - subnet: ${BIGDEVZ_SUBNET:-10.88.231.0/24}
